<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>falvideo</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; background: #0b0b0f; color: #eee; }
  h1 { font-size: 20px; }
  textarea { width: 100%; height: 90px; padding: 10px; border-radius: 8px; border: 1px solid #333; background: #16161c; color: #eee; font-size: 14px; }
  .file-row { margin-top: 10px; display: flex; align-items: center; gap: 10px; font-size: 13px; color: #aaa; }
  .file-row img, .file-row video { max-height: 60px; border-radius: 6px; }
  .file-row button { margin: 0; padding: 4px 10px; background: #333; }
  button { margin-top: 10px; padding: 10px 20px; border: none; border-radius: 8px; background: #6c5ce7; color: white; font-size: 14px; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  #status { margin-top: 12px; font-size: 13px; color: #aaa; white-space: pre-wrap; }
  video#result { margin-top: 16px; width: 100%; border-radius: 8px; }
</style>
</head>
<body>
  <h1>falvideo — fal.ai 動画生成</h1>
  <textarea id="prompt" placeholder="生成したい動画の内容を入力してください(画像を添付する場合は、その画像をどう動かしたいかを書いてください)"></textarea>

  <div class="file-row">
    <label for="fileInput" style="cursor:pointer; text-decoration: underline;">画像/動画を添付(任意)</label>
    <input type="file" id="fileInput" accept="image/*,video/*" hidden>
    <span id="filePreviewWrap" hidden>
      <img id="imgPreview" hidden>
      <video id="videoPreview" hidden muted></video>
    </span>
    <button id="clearFile" type="button" hidden>削除</button>
  </div>

  <br>
  <button id="generate">生成する</button>
  <div id="status"></div>
  <video id="result" controls hidden></video>

<script>
  const btn = document.getElementById('generate');
  const promptEl = document.getElementById('prompt');
  const statusEl = document.getElementById('status');
  const videoEl = document.getElementById('result');
  const fileInput = document.getElementById('fileInput');
  const filePreviewWrap = document.getElementById('filePreviewWrap');
  const imgPreview = document.getElementById('imgPreview');
  const videoPreview = document.getElementById('videoPreview');
  const clearFileBtn = document.getElementById('clearFile');

  fileInput.addEventListener('change', () => {
    const file = fileInput.files[0];
    imgPreview.hidden = true;
    videoPreview.hidden = true;
    if (!file) {
      filePreviewWrap.hidden = true;
      clearFileBtn.hidden = true;
      return;
    }
    const url = URL.createObjectURL(file);
    if (file.type.startsWith('image/')) {
      imgPreview.src = url;
      imgPreview.hidden = false;
    } else if (file.type.startsWith('video/')) {
      videoPreview.src = url;
      videoPreview.hidden = false;
    }
    filePreviewWrap.hidden = false;
    clearFileBtn.hidden = false;
  });

  clearFileBtn.addEventListener('click', () => {
    fileInput.value = '';
    filePreviewWrap.hidden = true;
    clearFileBtn.hidden = true;
  });

  btn.addEventListener('click', async () => {
    const prompt = promptEl.value.trim();
    if (!prompt) return;

    btn.disabled = true;
    videoEl.hidden = true;
    statusEl.textContent = '生成中です。1〜数分かかることがあります…';

    try {
      const formData = new FormData();
      formData.append('prompt', prompt);
      if (fileInput.files[0]) {
        formData.append('file', fileInput.files[0]);
      }

      const res = await fetch('/api/generate', {
        method: 'POST',
        body: formData,
      });
      const data = await res.json();

      if (!res.ok) throw new Error(data.error || '生成に失敗しました');

      videoEl.src = data.video.url;
      videoEl.hidden = false;
      statusEl.textContent = data.model
        ? `完了しました。(モデル: ${data.model}${data.reasoning ? ' — ' + data.reasoning : ''})`
        : '完了しました。';
    } catch (err) {
      statusEl.textContent = 'エラー: ' + err.message;
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
